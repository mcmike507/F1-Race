<style>
:root{--bg:#f3f1ee;--panel:#fff;--line:#d9d5cf;--tx:#1a1a1f;--mu:#6b6a70;--red:#d92b1c;--grn:#18a05a;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111218;--panel:#1a1b23;--line:#2b2d38;--tx:#f2f2f4;--mu:#9a9aa6;--red:#ff3b2a;--grn:#2fd27c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111218;--panel:#1a1b23;--line:#2b2d38;--tx:#f2f2f4;--mu:#9a9aa6;--red:#ff3b2a;--grn:#2fd27c;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif}
body{max-width:520px;margin:0 auto;padding:14px 14px 28px}
h1{font-family:"Barlow Condensed",Impact,sans-serif;font-size:36px;line-height:1;font-weight:700}
.num{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700}
.sub{color:var(--mu);font-size:14px;margin-top:4px}
header{margin-bottom:10px}
nav{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font:500 15px Barlow,sans-serif;padding:10px 4px;cursor:pointer}
nav button.on{color:var(--tx);border-bottom-color:var(--grn)}
button:focus-visible,.row:focus-visible{outline:2px solid var(--grn);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:16px;padding:5px 11px;font:500 13px Barlow,sans-serif;cursor:pointer;text-align:center;line-height:1.25}
.chip.on{background:var(--grn);border-color:var(--grn);color:#04210f}
.chip.done{color:var(--mu)}.chip.on,.chip.on.done{color:#04210f}.chip.on small{opacity:1}.chip.lv{border-color:var(--red)}
.chip small{display:block;font-weight:400;font-size:11px;opacity:.8}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);gap:8px;margin-bottom:6px}
.lbl b{color:var(--tx);font-weight:500}
.row{display:grid;grid-template-columns:28px 12px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.p{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:var(--mu)}
.dot{width:12px;height:12px;border-radius:50%}
.gap{color:var(--mu);font-variant-numeric:tabular-nums;font-size:14px}
.t1{font-weight:500;font-variant-numeric:tabular-nums}
.cal{grid-template-columns:30px 1fr auto;cursor:pointer;padding:10px 4px}
.st{font-size:12px;border-radius:10px;padding:2px 8px;border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.st.live{border-color:var(--red);color:var(--red);font-weight:500}
#cd{font-size:13px;color:var(--mu);margin:2px 0 8px}#cd b{color:var(--tx);font-weight:500}
.msg{font-size:15px;line-height:1.45}
.note{color:var(--mu);font-size:12.5px;line-height:1.4;margin-top:8px}
.news p{font-size:14.5px;line-height:1.45;margin-top:8px}
.tm{border-left:4px solid;padding:2px 0 2px 10px;margin-bottom:12px}
.sim{border:1px solid var(--red);color:var(--red);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:500;margin-bottom:10px}
.stg{font-size:12px;color:var(--mu);padding:8px 4px 2px}
.hide{display:none}
</style>
</head>

function dlabel(g){return new Date(g[3]+'T12:00:00').toLocaleDateString('es',{day:'numeric',month:'short'})}
var STL={done:'Finalizado',live:'Este fin de semana',next:'Próximo'};
function sessions(i){var g=GP[i],spr=SPR.indexOf(i)>-1,names=spr?['FP1','Sprint Q','Sprint','Q','Carrera']:['FP1','FP2','FP3','Q','Carrera'],race=new Date(g[3]+'T12:00:00').getTime(),offs=[-2,-2,-1,-1,0];
 return names.map(function(n,k){var s={n:n,day:race+offs[k]*864e5,t:null,d:60};if(i===SES){s.t=new Date(BRS[k][0]).getTime();s.d=BRS[k][1];s.day=s.t}return s})}
function sstat(s,i){var now=Date.now();if(s.t)return now<s.t?'next':now<s.t+s.d*6e4?'live':'done';return status(GP[i])==='done'?'done':'next'}
function stime(s){var d=new Date(s.day),a=d.toLocaleDateString('es',{weekday:'short'}).replace('.','')+' · '+d.getDate()+' '+d.toLocaleDateString('es',{month:'short'}).replace('.','');if(!s.t)return a;var h=d.getHours(),m=d.getMinutes();return a+'<br>'+(h%12||12)+':'+(m<10?'0':'')+m+' '+(h<12?'am':'pm')}
function tcol(c){return DRV.concat(EXTRA).filter(function(x){return x[0]===c})[0]}

function buildSess(i,keep){SL=sessions(i);
 $('sess').innerHTML=SL.map(function(s,k){var st=sstat(s,i);return '<button class="chip'+(st==='done'?' done':'')+(st==='live'?' lv':'')+'" data-k="'+k+'">'+(st==='live'?'● ':st==='done'?'✓ ':'')+s.n+'<small>'+stime(s)+'</small></button>'}).join('');
 snap=SL.map(function(s){return sstat(s,i)}).join();
 if(!keep){var k=-1;SL.forEach(function(s,m){if(sstat(s,i)==='live')k=m});
  if(k<0)SL.forEach(function(s,m){if(sstat(s,i)==='done')k=m});ses=k<0?0:k}
 selSess(ses);
 var nw=NEWS[i];$('news').classList.toggle('hide',!nw);
 if(nw)$('news').innerHTML='<div class="lbl"><b>Lo último del fin de semana</b><span>actualizado '+NEWSDATE+'</span></div>'+nw.map(function(t){return '<p>'+t+'</p>'}).join('')+'<p class="note">Fuentes: Crash.net y Sports Illustrated.</p>';}
function selSess(k){ses=k;[].forEach.call(document.querySelectorAll('#sess .chip'),function(c,j){c.classList.toggle('on',j===k)});renderRes();cdUpdate();}
function renderRes(){var s=SL[ses],i=cur,st=sstat(s,i),r=RES[i]&&RES[i][s.n],el=$('res'),g=GP[i];
 var head='<div class="lbl"><b>'+g[2]+' '+g[1]+' · '+SNAME[s.n]+'</b><span>'+(st==='done'?'finalizada':st==='live'?'en curso':'próxima')+'</span></div>';
 if(r){var q=s.n==='Q'||s.n==='Sprint Q',rows=parse(r.d);el.innerHTML=head+rows.map(function(x){var d=tcol(x[1]),t=TEAMS[d[2]],stg=q&&(x[0]===1?'Q3':x[0]===11?'Eliminados en Q2':x[0]===17?'Eliminados en Q1':'');
  return (stg?'<div class="stg">'+stg+'</div>':'')+'<div class="row"><span class="p">'+x[0]+'</span><span class="dot" style="background:'+t[1]+'"></span><span>'+d[1]+' <span class="gap">'+d[0]+' · '+t[0]+'</span></span><span class="t1">'+ftok(x[2])+'</span></div>'}).join('')+'<p class="note">'+(r.n?r.n+' ':'')+'Fuentes: The Race, Crash.net y Sports Illustrated. Puede cambiar si la FIA aplica sanciones después.</p>';return}
 if(s.n==='Carrera'&&st==='done'&&g[4]){var w=tcol(g[4]),wt=TEAMS[w[2]];el.innerHTML=head+'<div class="row"><span class="p">1</span><span class="dot" style="background:'+wt[1]+'"></span><span>'+w[1]+' <span class="gap">'+w[0]+' · '+wt[0]+'</span></span><span class="t1">'+g[6]+'</span></div><p class="note">Ganador oficial · '+g[5]+' vueltas. Solo está cargado el ganador de esta carrera. Fuente: formula1.com.</p>';return}
 el.innerHTML=head+'<p class="msg">'+(st==='live'?'La sesión está en curso. El resultado aparece aquí cuando termine.':st==='done'?'La sesión terminó, pero todavía no cargué su resultado confirmado.':'El resultado aparece aquí cuando termine la sesión.')+'</p>';}
function cdUpdate(){var el=$('cd'),now=Date.now(),nx=null,lv=null;
 SL.forEach(function(x){if(x.t){if(now>=x.t&&now<x.t+x.d*6e4)lv=x;else if(now<x.t&&!nx)nx=x}});
 function f(ms){var s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+'h ':'')+(h||m?m+'m ':'')+s%60+'s'}
 if(lv)el.innerHTML='<b>'+SNAME[lv.n]+'</b> en curso · termina en '+f(lv.t+lv.d*6e4-now);
 else if(nx)el.innerHTML='Próxima: <b>'+SNAME[nx.n]+'</b> en '+f(nx.t-now);
 else el.textContent=status(GP[cur])==='done'?'Gran Premio finalizado.':(SL[0]&&SL[0].t?'No quedan sesiónes este fin de semana.':'Horarios exactos por confirmar para este Gran Premio.');}
function loadGP(i){cur=i;[].forEach.call(document.querySelectorAll('#chips .chip'),function(c,j){c.classList.toggle('on',j===i);if(j===i)c.scrollIntoView({inline:'center',block:'nearest'})});buildSess(i,false);}

function showTab(t){['ses','cal','drv','team'].forEach(function(k){$('t-'+k).classList.toggle('hide',k!==t)});
 [].forEach.call(document.querySelectorAll('nav button'),function(b){b.classList.toggle('on',b.dataset.t===t)});window.scrollTo(0,0);}
document.querySelector('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)showTab(b.dataset.t)});
$('chips').innerHTML=GP.map(function(g,i){return '<button class="chip'+(status(g)==='done'?' done':'')+'" data-i="'+i+'">'+g[2]+' '+g[1]+'</button>'}).join('');
$('chips').addEventListener('click',function(e){var c=e.target.closest('.chip');if(c)loadGP(+c.dataset.i)});
$('sess').addEventListener('click',function(e){var c=e.target.closest('.chip');if(c)selSess(+c.dataset.k)});
$('calList').innerHTML=GP.map(function(g,i){var s=status(g);return '<div class="row cal" role="button" tabindex="0" data-i="'+i+'"><span style="font-size:22px">'+g[2]+'</span><span>'+g[0].replace('Gran Premio de ','GP ')+'<br><span class="gap">R'+(i+1)+' · '+dlabel(g)+(g[4]?' · Ganó '+tcol(g[4])[1].split(' ').slice(1).join(' '):'')+'</span></span><span class="st '+s+'">'+STL[s]+'</span></div>'}).join('');
function openGP(e){var r=e.target.closest('.cal');if(r){loadGP(+r.dataset.i);showTab('ses')}}
$('calList').addEventListener('click',openGP);
$('calList').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openGP(e)}});
$('drvList').innerHTML=DRV.map(function(x,i){var t=TEAMS[x[2]];return '<div class="row"><span class="p">'+(i+1)+'</span><span class="dot" style="background:'+t[1]+'"></span><span>'+x[1]+' <span class="gap">'+t[0]+'</span></span><span class="num" style="font-size:20px">'+x[3]+'</span></div>'}).join('');
$('teamList').innerHTML=TEAMS.map(function(t,i){return [t,i]}).sort(function(a,b){return b[0][3]-a[0][3]}).map(function(x,k){var t=x[0],i=x[1],ds=DRV.filter(function(d){return d[2]===i}).map(function(d){return d[1]}).join(' · ');return '<div class="panel tm" style="border-left-color:'+t[1]+'"><div class="lbl" style="margin:0"><span class="num" style="font-size:22px;color:var(--tx)">'+(k+1)+'. '+t[0]+'</span><span class="num" style="font-size:24px;color:var(--tx)">'+t[3]+'</span></div><div class="gap">'+ds+'</div><div class="gap">Motor: '+t[2]+'</div></div>'}).join('');

$('season').textContent='Temporada '+SEASON;
if(new Date().getFullYear()>SEASON){var sb=$('stale');sb.textContent='Estos datos son de la temporada '+SEASON+'. La nueva temporada necesita una actualización.';sb.classList.remove('hide')}
var a=-1,b=-1;GP.forEach(function(g,i){var s=status(g);if(s==='live'&&a<0)a=i;if(s==='next'&&b<0)b=i});
loadGP(a>=0?a:b>=0?b:GP.length-1);
setInterval(function(){cdUpdate();var s=SL.map(function(x){return sstat(x,cur)}).join();if(s!==snap)buildSess(cur,true)},1000);
})();
</script>
</body>
</html>
